services:
  postiz:
    image: ${OPENSEEK_IMAGE:-ghcr.io/liberseek/openseek-sm-ce}:${OPENSEEK_VERSION:-v0.0.1}
    container_name: openseek
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MAIN_URL: ${MAIN_URL:-http://localhost:4007}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4007}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4007/api}
      BACKEND_INTERNAL_URL: http://postiz:3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DATABASE_URL: postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local
      REDIS_URL: redis://postiz-redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      IS_GENERAL: ${IS_GENERAL:-true}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      NOT_SECURED: ${NOT_SECURED-true}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      AUTOMATION_PYTHON: /app/.venv-automation/bin/python
      DOMESTIC_PYTHON: /app/.venv-domestic/bin/python
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      RSSHUB_BASE_URL: ${RSSHUB_BASE_URL:-}
      RSSHUB_INTERNAL_TOKEN: ${RSSHUB_INTERNAL_TOKEN:-}
    volumes:
      - postiz-config:/config
      - postiz-uploads:/uploads
      - postiz-automation:/app/.automation
      - postiz-domestic:/app/.domestic
    ports:
      - "${PORT:-4007}:5000"
    networks:
      - openseek-network
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/auth/can-register').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 120s
      interval: 15s
      timeout: 5s
      retries: 20

  postiz-postgres:
    image: postgres:17-alpine
    container_name: openseek-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - openseek-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz-user -d postiz-db-local"]
      interval: 5s
      timeout: 5s
      retries: 20

  postiz-redis:
    image: redis:7.2-alpine
    container_name: openseek-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - postiz-redis-data:/data
    networks:
      - openseek-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal-postgresql:
    image: postgres:16-alpine
    container_name: openseek-temporal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-volume:/var/lib/postgresql/data
    networks:
      - openseek-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: openseek-temporal
    restart: unless-stopped
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      ENABLE_ES: "false"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
    networks:
      - openseek-network

volumes:
  postgres-volume:
  postiz-redis-data:
  postiz-config:
  postiz-uploads:
  postiz-automation:
  postiz-domestic:
  temporal-postgres-volume:

networks:
  openseek-network:
    name: openseek-network
